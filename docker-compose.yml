services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: backend:2.0
    container_name: backend
    volumes:
      - ./data:/app/data
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: frontend:2.0
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge